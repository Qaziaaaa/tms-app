name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  quality:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/tms_ci_placeholder
          AUTH_SECRET: ci-placeholder-secret

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Start MongoDB with replica set
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for i in $(seq 1 20); do
            if docker exec mongodb mongosh --quiet --eval "db.runCommand({ping:1}).ok" 2>/dev/null | grep -q 1; then
              echo "MongoDB is ready"
              break
            fi
            echo "Waiting for MongoDB... ($i/20)"
            sleep 2
          done
          docker exec mongodb mongosh --quiet --eval "rs.initiate()"
          sleep 3
          echo "Replica set initialized"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests (isolated tms_test DB)
        run: npx playwright test --reporter=line
        env:
          MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
          AUTH_SECRET: ci-e2e-secret

