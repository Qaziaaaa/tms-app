name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/tms_ci_placeholder
          AUTH_SECRET: ci-placeholder-secret

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1}).ok' --quiet || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
        command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Init replica set
        run: |
          for i in $(seq 1 30); do
            if docker exec $(docker ps --filter "ancestor=mongo:7" -q) mongosh --quiet --eval "try { rs.status().ok } catch(e) { rs.initiate().ok }" 2>/dev/null | grep -q 1; then
              echo "Replica set ready"
              exit 0
            fi
            echo "Waiting for MongoDB replica set... ($i/30)"
            sleep 2
          done
          echo "Failed to init replica set"
          exit 1

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests (isolated tms_test DB)
        run: npx playwright test --reporter=line
        env:
          MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
          AUTH_SECRET: ci-e2e-secret
